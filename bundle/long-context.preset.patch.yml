- insert:
    - id: preset-long-context
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: long-context
        name: Long Context
        description: Evidence-bound document editing with a persistent task ledger
        order: 5
        plugins:
          - id: long-context-agent
            name: dsh-long-context/agent
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: long-context-compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-long-context
                name: dsh-long-context/compaction
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
